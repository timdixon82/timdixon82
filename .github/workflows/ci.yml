# Continuous integration for the timdixon82 profile repository.
#
# This repository is Markdown-only: one README.md and supporting docs.
# There is no source code, no build step, and no JavaScript or PHP stack.
# CI therefore runs a Markdown linter rather than a stack-specific build.
#
# markdownlint-cli checks all .md files against the project's
# .markdownlint.json config (MD013 line-length and MD033 inline-HTML
# rules are disabled; all other defaults apply). This catches heading-
# order regressions, blank-line errors, and link syntax problems before
# they reach the main branch.
#
# No untrusted GitHub event input is used in any run: step.
#
# Action versions were verified against GitHub and pinned to commit SHAs
# on 2026-05-30. The version tag is in the trailing comment.

name: CI
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  markdown-lint:
    name: Markdown lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: lts/*
      - name: Install markdownlint-cli
        run: npm install -g markdownlint-cli
      - name: Lint all Markdown files
        run: markdownlint "**/*.md" --ignore node_modules
