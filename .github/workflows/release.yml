# Release automation with release-please.
#
# Runs on every push to main. release-please reads conventional commits
# and opens a release pull request when a releasable change is detected.
# It bumps VERSION (via extra-files in release-please-config.json) and
# generates CHANGELOG.md automatically.
#
# Action versions were verified against GitHub and pinned to commit SHAs
# on 2026-05-30. The version tag is in the trailing comment.

name: Release
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - name: Release Please
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7  # v5.0.0
        with:
          # GITHUB_TOKEN is a built-in secret provided automatically by
          # GitHub Actions on every run. No manual token configuration or
          # repository secret is required.
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
